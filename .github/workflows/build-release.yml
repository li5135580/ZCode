name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          # 暂时跳过 macOS 和 Linux，先确保 Windows 构建成功
          # - os: macos-latest
          #   target: mac
          # - os: ubuntu-latest
          #   target: linux

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --fetch-retries=5 --fetch-timeout=120000 --reporter=append-only || {
            echo "First install failed, trying with --force..."
            pnpm install --force --no-frozen-lockfile --fetch-retries=5 --fetch-timeout=120000
          }

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Build installer
        run: |
          # 先执行 build（包含 prepare:runtime-assets）
          pnpm --filter @zcode/desktop run build
          # 再执行 bundle（跳过 prepare 和 build）
          pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch x64
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          ZCODE_SKIP_PREPARE: "1"
          ZCODE_SKIP_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
          # 连接生产后端，同时使用 Preview 身份（与官方版并存，不冲突）
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zcode-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
          generate_release_notes: true