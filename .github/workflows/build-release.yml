name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Install dependencies
        # 必须用 --frozen-lockfile：--no-frozen-lockfile 会让 pnpm 重新解析依赖图，
        # 丢掉 lockfile 里的 overrides（react 版本锁定）和全部 patchedDependencies 补丁，
        # 生成损坏的依赖树（esbuild JS 库与平台二进制版本错配），导致 tsup/tsx 直接崩溃。
        run: pnpm install --frozen-lockfile --fetch-retries=5 --fetch-timeout=120000

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Build installer
        shell: bash
        run: |
          # bash + 显式退出码传递：Windows runner 的 PowerShell 不会把原生命令的退出码
          # 传出去，历史上因此出现过多次「绿色但实际失败」的假阳性。
          echo "=== [1/2] desktop build ==="
          pnpm --filter @zcode/desktop run build
          RC_BUILD=$?
          echo "=== desktop build exit code: $RC_BUILD ==="
          if [ "$RC_BUILD" -ne 0 ]; then
            echo "::error title=desktop build failed (exit $RC_BUILD)::pnpm run build 失败，见本次运行的 Build installer 步骤日志"
            exit "$RC_BUILD"
          fi

          echo "=== [2/2] electron-builder bundle ==="
          pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch x64
          RC_BUNDLE=$?
          echo "=== bundle exit code: $RC_BUNDLE ==="
          if [ "$RC_BUNDLE" -ne 0 ]; then
            echo "::error title=bundle failed (exit $RC_BUNDLE)::electron-builder 打包失败，见本次运行的 Build installer 步骤日志"
            exit "$RC_BUNDLE"
          fi
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          ZCODE_SKIP_PREPARE: "1"
          ZCODE_SKIP_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"

      - name: Verify renderer build output
        shell: bash
        run: |
          set -euo pipefail
          renderer_dir="packages/desktop/out/renderer"
          test -d "$renderer_dir" || { echo "ERROR: $renderer_dir not found"; exit 1; }
          for html in \
            index.html \
            resource-manager.html \
            cua-permission-panel.html \
            plugin-sandbox.html
          do
            test -s "$renderer_dir/$html" || { echo "ERROR: missing $renderer_dir/$html"; exit 1; }
            echo "FOUND $renderer_dir/$html"
          done
          echo "=== Renderer verification passed ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zcode-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
          generate_release_notes: true