name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build installer
        # 桌面安装包由 packages/desktop/scripts/bundle.mjs 产出（内部调用 electron-builder），
        # 输出到 packages/desktop/dist/。显式指定目标 OS/架构，避免默认的 mac/arm64。
        # 注意：不要用根目录的 `pnpm build:zcode`，它只产出 dist/zcode/ 运行时 tar 包，
        # 且缺少 ZCODE_DIST_BASE_URL 时会直接失败，不产出桌面安装包。
        run: pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch x64
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zcode-${{ matrix.os }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          generate_release_notes: true