name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --fetch-retries=5 --fetch-timeout=120000 --reporter=append-only || {
            echo "First install failed, trying with --force..."
            pnpm install --force --no-frozen-lockfile --fetch-retries=5 --fetch-timeout=120000
          }

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Prepare runtime assets
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets
        env:
          ZCODE_SKIP_REMOTE_ASSETS: "1"

      - name: Build production bundles
        shell: bash
        run: |
          echo "=== Running tsup ==="
          cd packages/desktop && pnpm exec tsup
          echo "=== Running vite build ==="
          cd packages/desktop && pnpm exec vite build
          echo "=== Build done ==="
        env:
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"

      - name: Verify renderer build output
        run: |
          echo "=== Checking renderer build output ==="
          ls -la packages/desktop/out/renderer/ || { echo "ERROR: out/renderer not found"; exit 1; }
          ls -la packages/desktop/out/renderer/*.html 2>/dev/null || { echo "ERROR: No HTML files in out/renderer"; exit 1; }
          echo "=== Renderer check passed ==="

      - name: Bundle installer
        run: pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch x64
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          ZCODE_SKIP_PREPARE: "1"
          ZCODE_SKIP_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zcode-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
          generate_release_notes: true