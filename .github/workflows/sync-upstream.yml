name: Sync Upstream

on:
  schedule:
    - cron: '0 * * * *'  # 每小时检测
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/zai-org/ZCode.git || true
          git fetch upstream

      - name: Check for updates
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          CURRENT_SHA=$(git rev-parse HEAD)
          # fork 的 main 始终比上游多出二开提交，直接比较两个 tip 会永远判定「有更新」，
          # 于是每小时都跑一遍无意义的同步。这里只判断上游是否存在 HEAD 还没有的提交。
          PENDING=$(git rev-list --count HEAD..upstream/main)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "current_sha=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "pending_commits=$PENDING" >> $GITHUB_OUTPUT
          if [ "$PENDING" -eq 0 ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # 二开改动本身就是 main 上的普通提交，`git merge` 会自动保留；
          # 这里不再重新应用 patches/0NN-*.patch —— 那些改动已经在工作树里，
          # `git apply` 只会报 "already exists / patch does not apply"，让同步每次都失败。
          # patches/ 目录仅作为二开内容的存档快照，不参与同步流程。
          #
          # 自动合并上游代码，保留本地历史。冲突时中止并退出，
          # 由下方 failure() 步骤创建 Issue 通知人工处理。
          git merge upstream/main --no-edit || {
            echo "Merge conflict with upstream"
            git merge --abort
            exit 1
          }

          # 提交变更并推送（非 force，避免覆盖他人/历史提交）
          git add .
          git commit -m "chore: sync upstream $(git rev-parse --short upstream/main)" || true
          git push origin main

      - name: Create issue on conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // 幂等创建 label，避免 labels 引用不存在导致 issues.create 返回 422
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'sync-conflict',
                color: 'd73a4a',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title: '⚠️ Upstream sync conflict detected',
              body: 'Automatic sync failed due to merge conflicts. Please resolve manually.',
              labels: ['sync-conflict'],
            });