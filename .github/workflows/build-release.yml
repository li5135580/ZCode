name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --fetch-retries=5 --fetch-timeout=120000 --reporter=append-only || {
            echo "First install failed, trying with --force..."
            pnpm install --force --no-frozen-lockfile --fetch-retries=5 --fetch-timeout=120000
          }

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Prepare runtime assets
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets
        env:
          ZCODE_SKIP_REMOTE_ASSETS: "1"

      - name: Build production bundles
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Running tsup ==="
          pnpm --dir packages/desktop exec tsup

          echo "=== Running vite build ==="
          echo "Current directory: $(pwd)"
          echo "Checking vite availability..."
          pnpm --dir packages/desktop exec vite --version || echo "vite not found via pnpm exec"
          ls packages/desktop/node_modules/.bin/vite* 2>/dev/null || echo "vite not in node_modules/.bin"
          ls node_modules/.bin/vite* 2>/dev/null || echo "vite not in root node_modules/.bin"

          echo "Running vite build with full output..."
          pnpm --dir packages/desktop exec vite build --config vite.config.ts 2>&1
          VITE_EXIT_CODE=$?
          echo "Vite build exit code: $VITE_EXIT_CODE"

          if [ $VITE_EXIT_CODE -ne 0 ]; then
            echo "ERROR: Vite build failed"
            exit $VITE_EXIT_CODE
          fi

          echo "=== Verifying renderer output ==="
          renderer_dir="packages/desktop/out/renderer"

          test -d "$renderer_dir" || { echo "ERROR: $renderer_dir not found"; exit 1; }

          for html in \
            index.html \
            resource-manager.html \
            cua-permission-panel.html \
            plugin-sandbox.html
          do
            test -s "$renderer_dir/$html" || { echo "ERROR: missing $renderer_dir/$html"; exit 1; }
            echo "FOUND $renderer_dir/$html"
          done

          echo "=== Build and renderer verification passed ==="
        env:
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"

      - name: Verify renderer build output
        shell: bash
        run: |
          echo "=== Checking renderer build output ==="
          # 检查所有可能的位置
          for dir in "packages/desktop/out/renderer" "out/renderer"; do
            echo "--- Checking $dir ---"
            if [ -d "$dir" ]; then
              ls -la "$dir"
              if ls "$dir"/*.html 1> /dev/null 2>&1; then
                echo "FOUND HTML files in $dir"
              else
                echo "NO HTML files in $dir"
              fi
            else
              echo "$dir not found"
            fi
          done
          echo "=== Renderer check done ==="

      - name: Bundle installer
        run: pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch x64
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          ZCODE_SKIP_PREPARE: "1"
          ZCODE_SKIP_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"

      - name: Upload build debug info
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-debug-${{ matrix.os }}
          path: |
            packages/desktop/out/
          retention-days: 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zcode-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
          generate_release_notes: true