name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # 保留其他平台日志，不要让 Windows 失败立即取消其他任务
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    env:
      # Electron 下载镜像（避免访问 GitHub）
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'  # 精确锁定版本

      - name: Install pnpm
        run: npm install -g pnpm@10.33.2

      - name: Verify pnpm installation
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --fetch-retries=5 --fetch-timeout=120000

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Build installer
        # 桌面安装包由 packages/desktop/scripts/bundle.mjs 产出（内部调用 electron-builder），
        # 输出到 packages/desktop/dist/。显式指定目标 OS/架构，避免默认的 mac/arm64。
        # 注意：不要用根目录的 `pnpm build:zcode`，它只产出 dist/zcode/ 运行时 tar 包，
        # 且缺少 ZCODE_DIST_BASE_URL 时会直接失败，不产出桌面安装包。
        run: pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch x64
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          # build 脚本自身还会执行 prepare:runtime-assets。
          # 跳过 bundle.mjs 外层的重复执行。
          ZCODE_SKIP_PREPARE: "1"
          ZCODE_SKIP_BUILD: "0"
          # CI 环境跳过签名
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 启用 electron-builder 调试日志
          DEBUG: electron-builder

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zcode-${{ matrix.os }}
          if-no-files-found: error  # 产物缺失时报错
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
          generate_release_notes: true