name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          # macOS 只出 arm64：Intel Mac 已停止出货，单独维护 x64 产物的收益低于构建成本。
          # 未签名构建依赖 electron-builder 的 ad-hoc 签名（arm64 强制要求），
          # 用户首次打开需要右键「打开」或清除 quarantine 属性。
          - os: macos-latest
            target: mac
            arch: arm64
          - os: ubuntu-latest
            target: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'

      - name: Install pnpm
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Install dependencies
        # 必须用 --frozen-lockfile：--no-frozen-lockfile 会让 pnpm 重新解析依赖图，
        # 丢掉 lockfile 里的 overrides（react 版本锁定）和全部 patchedDependencies 补丁，
        # 生成损坏的依赖树（esbuild JS 库与平台二进制版本错配），导致 tsup/tsx 直接崩溃。
        run: pnpm install --frozen-lockfile --fetch-retries=5 --fetch-timeout=120000

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Resolve fork app version
        shell: bash
        # 构建期注入 fork 版本：根 package.json 必须与上游对齐（如 3.15.1），
        # 但 `3.15.1-fork.N` 在 semver 里小于 3.15.1，electron-updater 不会认为有更新。
        # 因此 tag `v3.15.1-fork.2` 推导为 `3.15.2-fork.2`（patch + 1，保留 fork 序号）。
        # 推导逻辑在 scripts/ci/fork-release-version.mjs（有单测），这里只负责写 GITHUB_ENV。
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="$(node scripts/ci/fork-release-version.mjs --tag "$tag")"
            # Windows runner 的 PowerShell 不传递原生命令退出码，因此显式校验结果非空。
            if [ -z "$version" ]; then
              echo "::error title=fork version empty::无法从 tag ${tag} 推导 fork 版本"
              exit 1
            fi
            echo "ZCODE_APP_VERSION=$version" >> "$GITHUB_ENV"
            echo "fork app version: $version (from tag $tag)"
          else
            # 非 tag 触发（push main / workflow_dispatch）不发布 Release，
            # 沿用 package.json 版本，避免 run number 版本号跑在正式 fork tag 前面。
            echo "not a tag build; keep package.json version"
          fi

      - name: Build installer
        shell: bash
        run: |
          # bash + 显式退出码传递：Windows runner 的 PowerShell 不会把原生命令的退出码
          # 传出去，历史上因此出现过多次「绿色但实际失败」的假阳性。
          echo "=== [1/2] desktop build ==="
          pnpm --filter @zcode/desktop run build
          RC_BUILD=$?
          echo "=== desktop build exit code: $RC_BUILD ==="
          if [ "$RC_BUILD" -ne 0 ]; then
            echo "::error title=desktop build failed (exit $RC_BUILD)::pnpm run build 失败，见本次运行的 Build installer 步骤日志"
            exit "$RC_BUILD"
          fi

          echo "=== [2/2] electron-builder bundle ==="
          pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}
          RC_BUNDLE=$?
          echo "=== bundle exit code: $RC_BUNDLE ==="
          if [ "$RC_BUNDLE" -ne 0 ]; then
            echo "::error title=bundle failed (exit $RC_BUNDLE)::electron-builder 打包失败，见本次运行的 Build installer 步骤日志"
            exit "$RC_BUNDLE"
          fi
        env:
          ZCODE_UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL || '' }}
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          ZCODE_SKIP_PREPARE: "1"
          ZCODE_SKIP_BUILD: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ZCODE_ENV: "production"
          ZCODE_PREVIEW_IDENTITY: "1"
          # 构建期开启自动更新能力（对应 __ZCODE_AUTO_UPDATE_ENABLED__）。
          # 未设置时主进程不会 setFeedURL、不会注册 update-* 事件，手动检查只会返回 dev-skipped。
          ZCODE_AUTO_UPDATE: "1"
          # Linux 只出 AppImage + deb：rpm 需要 runner 预装 rpmbuild 与 xz，
          # pacman 也需要额外工具，对分发验证场景是不必要的构建面。
          ZCODE_LINUX_TARGETS: "AppImage,deb"

      - name: Normalize update manifest asset urls
        shell: bash
        # electron-builder 把磁盘上的真实文件名写进更新清单，而 artifactName 含 ${productName}
        # （`ZCode Preview`，带空格）。GitHub Release 上传时会把空格替换成点号，
        # 若清单仍写带空格的 url，客户端拼出的 releases/latest/download/<url> 会 404。
        # 清单文件名随平台变化：Windows latest.yml、macOS latest-mac.yml、Linux latest-linux.yml。
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            mac) manifest="latest-mac.yml" ;;
            linux) manifest="latest-linux.yml" ;;
            *) manifest="latest.yml" ;;
          esac
          node scripts/ci/normalize-latest-yml.mjs --dir packages/desktop/dist --file "$manifest"
          echo "=== $manifest ==="
          cat "packages/desktop/dist/$manifest"
          test -s "packages/desktop/dist/$manifest" || { echo "::error::$manifest 缺失或为空"; exit 1; }

      - name: Verify Linux update manifest points at AppImage
        shell: bash
        if: matrix.target == 'linux'
        # electron-updater 在 Linux 上只认 AppImage 作为更新产物，deb 仅用于首次安装分发。
        run: |
          set -euo pipefail
          manifest="packages/desktop/dist/latest-linux.yml"
          if ! grep -q "\.AppImage" "$manifest"; then
            echo "::error::latest-linux.yml 未指向 AppImage 产物，electron-updater 无法在 Linux 上更新"
            exit 1
          fi

      - name: Verify renderer build output
        shell: bash
        run: |
          set -euo pipefail
          renderer_dir="packages/desktop/out/renderer"
          test -d "$renderer_dir" || { echo "ERROR: $renderer_dir not found"; exit 1; }
          for html in \
            index.html \
            resource-manager.html \
            cua-permission-panel.html \
            plugin-sandbox.html
          do
            test -s "$renderer_dir/$html" || { echo "ERROR: missing $renderer_dir/$html"; exit 1; }
            echo "FOUND $renderer_dir/$html"
          done
          echo "=== Renderer verification passed ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: zcode-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.pkg.tar.zst
            # electron-updater 的更新元数据：latest.yml 里 files[].url 指向同目录安装包，
            # 必须和安装包一起上传到 Release，客户端才能发现更新。
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Release 正文取仓库维护的 RELEASE-NOTES.md（发版时随代码一起更新），
          # 而不是 generate_release_notes 自动生成的空壳正文——后者只有一行
          # compare 链接，用户看不到产物清单与安装注意事项。
          body_path: RELEASE-NOTES.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
            # 更新元数据与差分块文件：latest.yml 由 electron-builder 的 generic publish
            # 配置生成，客户端默认从 releases/latest/download/latest.yml 读取。
            artifacts/**/*.yml
            artifacts/**/*.blockmap

      - name: Prune old releases
        # 只保留最近两个 Release。electron-updater 读的是 releases/latest/download，
        # 旧 Release 只占仓库空间、干扰人工回滚判断，留着没有实际作用。
        # tag 不删：保留可回溯的构建点，需要时能从同一 commit 重新发版。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep=2
          current="${{ github.ref_name }}"
          # 按发布时间倒序；当前这次构建的 tag 永远保留，避免排序异常把自己删掉。
          mapfile -t tags < <(
            gh release list --limit 100 --exclude-drafts \
              --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName'
          )
          echo "existing releases: ${#tags[@]} (keep=$keep, current=$current)"
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::gh release list returned nothing; refusing to continue silently"
            exit 1
          fi
          if [ "${#tags[@]}" -le "$keep" ]; then
            echo "nothing to prune"
            exit 0
          fi
          for tag in "${tags[@]:$keep}"; do
            if [ "$tag" = "$current" ]; then
              echo "skip current release: $tag"
              continue
            fi
            echo "deleting release: $tag"
            gh release delete "$tag" --yes
          done